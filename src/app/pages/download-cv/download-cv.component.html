<div class="container">
  <header class="header">
    <h1>Download my CV</h1>
  </header>

  <main class="main-content">
      <div class="cv-buttons">
        @for (cv of cvs; track cv) {
          <a class="cv-btn" [href]="cv.file" download>{{ cv.label }}</a>
        }
      </div>
      <p class="cv-updated">Last updated: <i>{{ lastUpdated }}</i></p>
  </main>
</div>
